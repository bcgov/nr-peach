    post:
      summary: Validates a specific asset record addition
      description: Validates a specific asset record addition without making any changes.
      operationId: postValidateRecords
      tags:
        - Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
      responses:
        '200':
          description: OK - Validated the Record addition without making any changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Validates a specific asset record assertion
      description: Validates a specific asset record assertion without making any changes.
      operationId: putValidateRecords
      tags:
        - Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
      responses:
        '200':
          description: OK - Validated the Record assertion without making any changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /systems:
    get:
      summary: Checks if a specific system has records being tracked
      description: >-
        Checks if a specific system has records being tracked. Returns true if
        the system is being tracked, false if system is known but not tracked,
        404 if not found in JIRA ITSM (TBD in scope?).
      operationId: getSystems
      tags:
        - Systems
      parameters:
        - $ref: '#/components/parameters/Query-SystemId-Required'
      responses:
        '200':
          description: OK - System tracking status
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Query-AssetId:
      in: query
      name: asset_id
      description: Asset Identifier
      schema:
        $ref: '#/components/schemas/Attribute-AssetId'
    Query-AssetId-Required:
      in: query
      name: asset_id
      description: Asset Identifier
      required: true
      schema:
        $ref: '#/components/schemas/Attribute-AssetId'
    Query-AssetKind:
      in: query
      name: asset_kind
      description: Asset Kind
      schema:
        $ref: '#/components/schemas/Attribute-AssetKind'
    Query-Depth:
      in: query
      name: depth
      description: |
        Specifies the maximum number of hops allowed in linkage graph traversal.
        Default is 1 if undefined, and -1 indicates no limit.
      schema:
        type: integer
        minimum: -1
        default: 1
        examples:
          - 1
    Query-Limit:
      in: query
      name: limit
      description: |
        Specifies the maximum number of items to return.
        Default is 10 if undefined, and -1 indicates no limit.
      schema:
        type: integer
        minimum: -1
        default: 10
        examples:
          - -1
          - 1
          - 10
    Query-Linked-AssetId-Required:
      in: query
      name: linked_asset_id
      description: Asset Identifier
      required: true
      schema:
        $ref: '#/components/schemas/Attribute-AssetId'
    Query-Linked-SystemId:
      in: query
      name: linked_system_id
      description: System Identifier
      schema:
        $ref: '#/components/schemas/Attribute-SystemId'
    Query-Offset:
      in: query
      name: offset
      description: |
        Specifies the number of items to skip before starting to collect the result set.
        Default is 0 if undefined.
      schema:
        type: integer
        minimum: 0
        default: 0
        examples:
          - 0
          - 1
          - 10
    Query-RelationKind:
      in: query
      name: relation_kind
      description: Relation Kind
      schema:
        $ref: '#/components/schemas/Attribute-RelationKind'
    Query-SystemId:
      in: query
      name: system_id
      description: System Identifier
      schema:
        $ref: '#/components/schemas/Attribute-SystemId'
    Query-SystemId-Required:
      in: query
      name: system_id
      description: System Identifier
      required: true
      schema:
        $ref: '#/components/schemas/Attribute-SystemId'
  schemas:
    Attribute-AssetId:
      type: string
      description: >-
        The primary key representing what the data this asset is directly
        associated to.
      examples:
        - 06bc53dc-3e4f-420b-801c-bd9cc0ea01b2
    Attribute-AssetKind:
      type: string
      description: Declares the precise type of asset represented in a message.
      enum:
        - ANCHOR
        - PERMIT
        - PROJECT
      examples:
        - ANCHOR
        - PERMIT
        - PROJECT
    Attribute-RelationKind:
      type: string
      description: Declares the type of relation in a linkage.
      enum:
        - MERGES
        - RELATES
        - SELF
        - SPLITS
      examples:
        - MERGES
        - RELATES
        - SELF
        - SPLITS
    Attribute-SystemId:
      type: string
      description: >-
        A valid URI or set of URIs that identifies the source system, service or
        asset that the data comes from. This is typically a string; however an
        array of unordered URIs can be used to indicate that multiple systems
        were used to compile the data in this message. This URI should point to
        an authoritative asset tracking system or equivalent. However, the URI
        does not need to be machine readable.
      format: uri
      examples:
        - https://apps.nrs.gov.bc.ca/int/jira/secure/insight/assets/ITSM-5917
    Header-WWW-Authenticate:
      title: Header WWW-Authenticate
      type: string
      description: HTTP Authentication header indicating the status of the request
    Request-SearchAssets:
      title: Request Search Assets
      description: Search using simple qualification criteria for matching asset headers.
      allOf:
        - $ref: '#/components/schemas/Search-ArrayFilters'
        - $ref: '#/components/schemas/Search-Base'
    Request-SearchGroups:
      title: Request Search Groups
      description: Search using simple qualification criteria for matching groups.
      allOf:
        - $ref: '#/components/schemas/Search-ArrayFilters'
        - $ref: '#/components/schemas/Search-Base'
    Request-SearchLinkages:
      title: Request Search Linkages
      description: Search using simple qualification criteria for matching linkages.
      allOf:
        - type: object
          properties:
            asset_id:
              $ref: '#/components/schemas/Attribute-AssetId'
            asset_kind:
              $ref: '#/components/schemas/Attribute-AssetKind'
            relation_kind:
              $ref: '#/components/schemas/Attribute-RelationKind'
            system_id:
              $ref: '#/components/schemas/Attribute-SystemId'
        - $ref: '#/components/schemas/Search-LinkedFilters'
        - $ref: '#/components/schemas/Search-Base'
    Response-BadRequest:
      title: Response Bad Request
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 400
            title:
              examples:
                - Bad Request
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/400
    Response-Conflict:
      title: Response Conflict
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 409
            title:
              examples:
                - Conflict
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/409
    Response-Error:
      title: Response Error
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 500
            title:
              examples:
                - Internal Server Error
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/500
    Response-Forbidden:
      title: Response Forbidden
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403
            title:
              examples:
                - Forbidden
            status:
              examples:
                - 403
            detail:
              examples:
                - User lacks permission to complete this action
    Response-NotFound:
      title: Response Not Found
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 404
            title:
              examples:
                - Not Found
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/404
    Response-Problem:
      title: Response Problem
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: What type of problem, link to explanation of problem
        title:
          type: string
          description: Title of problem, generally the HTTP Status Code description
        status:
          type: string
          description: The HTTP Status code
        detail:
          type: string
          description: >-
            A short, human-readable explanation specific to this occurrence of
            the problem
        instance:
          type: string
          description: >-
            A URI reference that identifies the specific occurrence of the
            problem
    Response-Unauthorized:
      title: Response Unauthorized
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
            title:
              examples:
                - Unauthorized
            status:
              examples:
                - 401
            detail:
              examples:
                - Invalid authorization credentials
    Response-ValidationError:
      title: Response Validation Error
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - message
                properties:
                  value:
                    type: object
                    description: Contents of the field that was in error.
                    examples:
                      - {}
                  message:
                    type: string
                    description: The error message for the field.
                    examples:
                      - Invalid value `encoding`.
            status:
              examples:
                - 422
            title:
              examples:
                - Unprocessable Entity
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/422
    Search-ArrayFilters:
      type: object
      properties:
        asset_id:
          type: array
          minItems: 1
          description: Optional list of specific asset identifiers to match.
          items:
            $ref: '#/components/schemas/Attribute-AssetId'
        asset_kind:
          type: array
          minItems: 1
          description: Filter to items matching any of these asset kinds.
          items:
            $ref: '#/components/schemas/Attribute-AssetKind'
        relation_kind:
          type: array
          minItems: 1
          description: Filter to items matching any of these relation kinds.
          items:
            $ref: '#/components/schemas/Attribute-RelationKind'
        system_id:
          type: array
          minItems: 1
          description: Filter to items associated with any of these systems.
          items:
            $ref: '#/components/schemas/Attribute-SystemId'
    Search-Base:
      type: object
      required:
        - search_kind
      properties:
        search_kind:
          type: string
          description: Filter by membership, direct association, or path-based relation.
          enum:
            - FILTER
            - MEMBER
            - PATH
          examples:
            - FILTER
            - MEMBER
            - PATH
        depth:
          type: integer
          description: |
            Specifies the maximum number of hops allowed in linkage graph traversal.
            Default is 1 if undefined, and -1 indicates no limit.
          minimum: -1
          default: 1
          examples:
            - 1
        limit:
          type: integer
          description: |
            Specifies the maximum number of items to return.
            Default is 10 if undefined, and -1 indicates no limit.
          minimum: -1
          default: 10
          examples:
            - -1
            - 1
            - 10
        offset:
          type: integer
          description: |
            Specifies the number of items to skip before starting to collect the result set.
            Default is 0 if undefined.
          minimum: 0
          default: 0
          examples:
            - 0
            - 1
            - 10
    Search-LinkedFilters:
      type: object
      properties:
        linked_asset_id:
          $ref: '#/components/schemas/Attribute-AssetId'
        linked_asset_kind:
          $ref: '#/components/schemas/Attribute-AssetKind'
        linked_system_id:
          $ref: '#/components/schemas/Attribute-SystemId'
  responses:
    BadRequest:
      description: Bad Request (Missing content or malformed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-BadRequest'
      headers:
        WWW-Authenticate:
          schema:
            $ref: '#/components/schemas/Header-WWW-Authenticate'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-Conflict'
    Error:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-Error'
    Forbidden:
      description: Forbidden (Insufficient privileges)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-Forbidden'
      headers:
        WWW-Authenticate:
          schema:
            $ref: '#/components/schemas/Header-WWW-Authenticate'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-NotFound'
    Unauthorized:
      description: Unauthorized (Requires authentication)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-Unauthorized'
      headers:
        WWW-Authenticate:
          schema:
            $ref: '#/components/schemas/Header-WWW-Authenticate'
    UnprocessableEntity:
      description: Unprocessable Content (Generally validation error(s))
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response-ValidationError'
  securitySchemes:
    BearerAuth:
      type: http
      description: Bearer token auth using an OIDC issued JWT token
      scheme: bearer
      bearerFormat: JWT
    OpenID:
      type: openIdConnect
      description: OpenID Connect endpoint for acquiring JWT tokens
      openIdConnectUrl: >-
        https://logonproxy.gov.bc.ca/auth/realms/your-realm-name/.well-known/openid-configuration
