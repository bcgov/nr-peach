---
openapi: 3.2.0
info:
  version: 0.1.0
  title: NR Peach API
  description: |
    A microservice focused on permitting exchange, aggregation and collection
    using PIES.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: This server
security:
  - BearerAuth: []
    OpenID: []
tags:
  - name: Assets
    description: Operations for managing Assets.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#assets
  - name: Groups
    description: Operations for managing Groups.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#groups
  - name: Linkages
    description: Operations for managing Linkages.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#linkages
  - name: Records
    description: Operations for managing Records.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#records
  - name: Systems
    description: Operations for managing Systems. May potentially proxy to JIRA API.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#systems
paths:
  /assets:
    get:
      summary: Get a specific asset header
      description: Get a specific asset header
      operationId: getAssets
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '200':
          description: OK - An asset header
          content:
            application/json:
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/data/header.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a specific asset
      description: Deletes a specific asset and all associated data
      operationId: deleteAssets
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /groups:
    get:
      summary: List or look up groups
      description: >
        Retrieves matching groups. Supports filtering by asset_kind,
        relation_kind, asset_id and system_id. Does not introspect membership
        assets.
      operationId: getGroups
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/Query-AssetId'
        - $ref: '#/components/parameters/Query-SystemId'
        - $ref: '#/components/parameters/Query-AssetKind'
        - $ref: '#/components/parameters/Query-RelationKind'
        - $ref: '#/components/parameters/Query-Limit'
        - $ref: '#/components/parameters/Query-Offset'
      responses:
        '200':
          description: OK - A list of matching group messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Add and modify a specific group asset
      description: Adds and merges all known assets into the asset set.
      operationId: postGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '202':
          description: >-
            Accepted - Merged an existing Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Assert an asset set for a specific group
      description: Replaces all known assets in the asset set.
      operationId: putGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '201':
          description: Created - Added a new Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Prune all assets from the asset set
      description: Deletes all known assets from the asset set.
      operationId: pruneGroups
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /groups/validate:
    post:
      summary: Validates a specific group message addition
      description: Validates a specific group message without making any changes.
      operationId: postValidateGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '202':
          description: >-
            Accepted - Merged an existing Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Validates a specific asset set assertion
      description: Validates a specific group message without making any changes.
      operationId: putValidateGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '201':
          description: Created - Added a new Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  # CONSIDER: Do we want a dedicated endpoint for searching via both members and groups recursively?
  # What should this be called?
  /linkages:
    get:
      summary: List linkages for a specific asset record
      description: >-
        Retrieves a flattened set of all known linkages associated with a
        record.
      operationId: getLinkages
      tags:
        - Linkages
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
        - $ref: '#/components/parameters/Query-Depth'
      responses:
        '200':
          description: OK - A set of linkage messages associated with a record
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Adds linkages for a specific asset record
      description: Adds linkages associated with a record.
      operationId: putRecordLinkages
      tags:
        - Linkages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
      responses:
        '201':
          description: Created - Added a new Record with the associated linkage
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a specific linkage for a specific asset record
      description: Deletes a specific linkage associated with a record.
      operationId: deleteLinkages
      tags:
        - Linkages
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
        - $ref: '#/components/parameters/Query-Linked-AssetId-Required'
        - $ref: '#/components/parameters/Query-Linked-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /linkages/validate:
    put:
      summary: Validates a specific linkage addition
      description: Validates a specific linkage without making any changes.
      operationId: putValidateLinkages
      tags:
        - Linkages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
      responses:
        '200':
          description: OK - Validated the linkage without making any changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /records:
    get:
      summary: List Events for a specific asset record
      description: Retrieves a set of all known Events associated with a record.
      operationId: getRecords
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '200':
          description: OK - A ProcessEventSet message associated with a record
          content:
            application/json:
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Add and merge Events for a specific asset record
      description: Adds and merges all known Events associated with a record.
      operationId: postRecords
      tags:
        - Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
      responses:
        '202':
          description: >-
            Accepted - Merged an existing Record with the associated
            ProcessEvents
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Assert Events for a specific asset record
      description: Replaces all known Events associated with a record.
      operationId: putRecords
      tags:
        - Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
      responses:
        '201':
          description: Created - Added a new Record with the associated ProcessEvents
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Prune all Events for a specific asset record
      description: Deletes all known Events associated with a record.
      operationId: pruneRecords
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /records/validate:
    post:
      summary: Validates a specific asset record addition
      description: Validates a specific asset record addition without making any changes.
      operationId: postValidateRecords
      tags:
        - Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
      responses:
        '200':
          description: OK - Validated the Record addition without making any changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Validates a specific asset record assertion
      description: Validates a specific asset record assertion without making any changes.
      operationId: putValidateRecords
      tags:
        - Records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
      responses:
        '200':
          description: OK - Validated the Record assertion without making any changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /systems:
    get:
      summary: Checks if a specific system has records being tracked
      description: >-
        Checks if a specific system has records being tracked. Returns true if
        the system is being tracked, false if system is known but not tracked,
        404 if not found in JIRA ITSM (TBD in scope?).
      operationId: getSystems
      tags:
        - Systems
      parameters:
        - $ref: '#/components/parameters/Query-SystemId-Required'
      responses:
        '200':
          description: OK - System tracking status
          content:
            application/json:
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    Query-AssetId-Required:
      in: query
      name: asset_id
      description: Asset Identifier
      required: true
      schema:
        $ref: '#/components/schemas/Attribute-AssetId'
    Query-Depth:
      in: query
      name: depth
      description: |
        Specifies the maximum number of hops allowed in linkage graph traversal.
        Default is 1 if undefined, and -1 indicates no limit.
      schema:
        type: integer
        minimum: -1
        default: 1
        examples:
          - 1
    Query-Linked-AssetId-Required:
      in: query
      name: linked_asset_id
      description: Asset Identifier
      required: true
      schema:
        $ref: '#/components/schemas/Attribute-AssetId'
    Query-Linked-SystemId:
      in: query
      name: linked_system_id
      description: System Identifier
      schema:
        $ref: '#/components/schemas/Attribute-SystemId'
    Query-SystemId:
      in: query
      name: system_id
      description: System Identifier
      schema:
        $ref: '#/components/schemas/Attribute-SystemId'
    Query-SystemId-Required:
      in: query
      name: system_id
      description: System Identifier
      required: true
      schema:
        $ref: '#/components/schemas/Attribute-SystemId'
  schemas:
    Attribute-AssetId:
      type: string
      description: >-
        The primary key representing what the data this asset is directly
        associated to.
      examples:
        - 06bc53dc-3e4f-420b-801c-bd9cc0ea01b2
    Attribute-SystemId:
      type: string
      description: >-
        A valid URI or set of URIs that identifies the source system, service or
        asset that the data comes from. This is typically a string; however an
        array of unordered URIs can be used to indicate that multiple systems
        were used to compile the data in this message. This URI should point to
        an authoritative asset tracking system or equivalent. However, the URI
        does not need to be machine readable.
      format: uri
      examples:
        - https://apps.nrs.gov.bc.ca/int/jira/secure/insight/assets/ITSM-5917
    Header-WWW-Authenticate:
      title: Header WWW-Authenticate
      type: string
      description: HTTP Authentication header indicating the status of the request
    Response-BadRequest:
      title: Response Bad Request
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 400
            title:
              examples:
                - Bad Request
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/400
    Response-Conflict:
      title: Response Conflict
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 409
            title:
              examples:
                - Conflict
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/409
    Response-Error:
      title: Response Error
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 500
            title:
              examples:
                - Internal Server Error
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/500
    Response-Forbidden:
      title: Response Forbidden
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403
            title:
              examples:
                - Forbidden
            status:
              examples:
                - 403
            detail:
              examples:
                - User lacks permission to complete this action
    Response-NotFound:
      title: Response Not Found
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            status:
              examples:
                - 404
            title:
              examples:
                - Not Found
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/404
    Response-Problem:
      title: Response Problem
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: What type of problem, link to explanation of problem
        title:
          type: string
          description: Title of problem, generally the HTTP Status Code description
        status:
          type: string
          description: The HTTP Status code
        detail:
          type: string
          description: >-
            A short, human-readable explanation specific to this occurrence of
            the problem
        instance:
          type: string
          description: >-
            A URI reference that identifies the specific occurrence of the
            problem
    Response-Unauthorized:
      title: Response Unauthorized
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          properties:
            type:
              examples:
                - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/401
            title:
              examples:
                - Unauthorized
            status:
              examples:
                - 401
            detail:
              examples:
                - Invalid authorization credentials
    Response-ValidationError:
      title: Response Validation Error
      type: object
      allOf:
        - $ref: '#/components/schemas/Response-Problem'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - message
                properties:
                  value:
                    type: object
                    description: Contents of the field that was in error.
                    examples:
