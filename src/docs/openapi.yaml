---
openapi: 3.2.0
info:
  version: 0.1.0
  title: NR Peach API
  description: |
    A microservice focused on permitting exchange, aggregation and collection
    using PIES.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: This server
security:
  - BearerAuth: []
    OpenID: []
tags:
  - name: Assets
    description: Operations for managing Assets.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#assets
  - name: Groups
    description: Operations for managing Groups.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#groups
  - name: Linkages
    description: Operations for managing Linkages.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#linkages
  - name: Records
    description: Operations for managing Records.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#records
  - name: Systems
    description: Operations for managing Systems. May potentially proxy to JIRA API.
    externalDocs:
      url: https://github.com/bcgov/nr-peach/wiki/Endpoint-Notes#systems
paths:
  /assets:
    get:
      summary: Get a specific asset header
      description: Get a specific asset header
      operationId: getAssets
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-AssetKind'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '200':
          description: OK - An asset header
          content:
            application/json:
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/data/header.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a specific asset
      description: Deletes a specific asset and all associated data
      operationId: deleteAssets
      tags:
        - Assets
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /assets/search:
    post:
      summary: Search for qualifying assets with complex criteria
      description: >
        Evaluates a list of qualifying criteria and simple qualification
        traversal rules, returning matching assets.
      operationId: searchAssets
      tags:
        - Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request-SearchAssets'
      responses:
        '200':
          description: OK - List of qualifying asset headers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/data/header.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /groups:
    get:
      summary: Get a specific group
      description: Gets a specific group
      operationId: getGroups
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-AssetKind'
        - $ref: '#/components/parameters/Query-SystemId'
        - $ref: '#/components/parameters/Query-RelationKind'
      responses:
        '200':
          description: OK - A group message
          content:
            application/json:
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Add and modify a specific group asset
      description: Adds and merges all known assets into the asset set.
      operationId: postGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '202':
          description: >-
            Accepted - Merged an existing Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Assert an asset set for a specific group
      description: Replaces all known assets in the asset set.
      operationId: putGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '201':
          description: Created - Added a new Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Prune all assets from the asset set
      description: Deletes all known assets from the asset set.
      operationId: pruneGroups
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /groups/search:
    post:
      summary: Search for qualifying groups with complex criteria
      description: >
        Evaluates a list of qualifying criteria and simple qualification
        traversal rules, returning matching groups.
      operationId: searchGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request-SearchGroups'
      responses:
        '200':
          description: OK - List of qualifying groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /groups/validate:
    post:
      summary: Validates a specific group message addition
      description: Validates a specific group message without making any changes.
      operationId: postValidateGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '202':
          description: >-
            Accepted - Merged an existing Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Validates a specific asset set assertion
      description: Validates a specific group message without making any changes.
      operationId: putValidateGroups
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/group.schema.json
      responses:
        '201':
          description: Created - Added a new Group with the associated assets
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /linkages:
    get:
      summary: Get a specific linkage
      description: Gets a specific linkage.
      operationId: getLinkages
      tags:
        - Linkages
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-AssetKind'
        - $ref: '#/components/parameters/Query-SystemId'
        - $ref: '#/components/parameters/Query-RelationKind'
      responses:
        '200':
          description: OK - A linkage message
          content:
            application/json:
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Adds linkages for a specific asset record
      description: Adds linkages associated with a record.
      operationId: putRecordLinkages
      tags:
        - Linkages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
      responses:
        '201':
          description: Created - Added a new Record with the associated linkage
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Deletes a specific linkage for a specific asset record
      description: Deletes a specific linkage associated with a record.
      operationId: deleteLinkages
      tags:
        - Linkages
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
        - $ref: '#/components/parameters/Query-Linked-AssetId-Required'
        - $ref: '#/components/parameters/Query-Linked-SystemId'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /linkages/search:
    post:
      summary: Search for qualifying linkages with complex criteria
      description: >
        Evaluates a list of qualifying criteria and simple qualification
        traversal rules, returning matching linkages.
      operationId: searchLinkages
      tags:
        - Linkages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request-SearchLinkages'
      responses:
        '200':
          description: OK - List of qualifying linkages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /linkages/validate:
    put:
      summary: Validates a specific linkage addition
      description: Validates a specific linkage without making any changes.
      operationId: putValidateLinkages
      tags:
        - Linkages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: >-
                https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/linkage.schema.json
      responses:
        '200':
          description: OK - Validated the linkage without making any changes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /records:
    get:
      summary: List Events for a specific asset record
      description: Retrieves a set of all known Events associated with a record.
      operationId: getRecords
      tags:
        - Records
      parameters:
        - $ref: '#/components/parameters/Query-AssetId-Required'
        - $ref: '#/components/parameters/Query-SystemId'
      responses:
        '200':
          description: OK - A ProcessEventSet message associated with a record
          content:
            application/json:
              schema:
                $ref: >-
                  https://raw.githubusercontent.com/bcgov/nr-pies/refs/heads/main/docs/spec/element/message/record.schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    post:
